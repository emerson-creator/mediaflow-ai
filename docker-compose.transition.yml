name: mediaflow-dev

services:
  # ---------------- Infrastructure ----------------
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: mediaflow-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  # ---------------- Application services (hot-reload) ----------------
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile.dev
    container_name: mediaflow-gateway
    environment:
      GATEWAY_PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      INGESTION_URL: http://ingestion:3001
    ports:
      - "3000:3000"
    volumes:
      - ./gateway/src:/app/src
    command: npm run start:dev

  ingestion:
    build:
      context: ./services/ingestion
      dockerfile: Dockerfile.dev
    container_name: mediaflow-ingestion
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      INGESTION_PORT: 3001
      DATABASE_URL: ${DATABASE_URL}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_BUCKET_NAME: ${AWS_BUCKET_NAME}
    ports:
      - "3001:3001"
    volumes:
      - ./services/ingestion/src:/app/src
    command: npm run start:dev
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  notification:
    build:
      context: ./services/notification
      dockerfile: Dockerfile.dev
    container_name: mediaflow-notification
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      NOTIFICATION_PORT: 3002
      JWT_SECRET: ${JWT_SECRET}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "3002:3002"
    volumes:
      - ./services/notification/src:/app/src
    command: npm run start:dev

  worker:
    build:
      context: ./services/worker
      dockerfile: Dockerfile
    container_name: mediaflow-worker
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_BUCKET_NAME: ${AWS_BUCKET_NAME}
      DATABASE_URL: ${DATABASE_URL}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    volumes:
      - ./services/worker/app:/app/app

volumes:
  rabbitmq_data:
