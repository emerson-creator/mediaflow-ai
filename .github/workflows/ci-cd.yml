name: MediaFlow CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/emerson-creator

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            gateway/package-lock.json
            services/ingestion/package-lock.json
            services/notification/package-lock.json

      - name: Validate frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Validate gateway
        working-directory: gateway
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Validate ingestion
        working-directory: services/ingestion
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Validate notification
        working-directory: services/notification
        run: |
          npm ci
          npm run lint
          npm run build

  publish:
    name: Build and publish Docker images
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        run: echo "IMAGE_TAG=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push gateway
        uses: docker/build-push-action@v6
        with:
          context: ./gateway
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/mediaflow-gateway:${{ env.IMAGE_TAG }}

      - name: Build and push ingestion
        uses: docker/build-push-action@v6
        with:
          context: ./services/ingestion
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/mediaflow-ingestion:${{ env.IMAGE_TAG }}

      - name: Build and push notification
        uses: docker/build-push-action@v6
        with:
          context: ./services/notification
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/mediaflow-notification:${{ env.IMAGE_TAG }}

      - name: Build and push worker
        uses: docker/build-push-action@v6
        with:
          context: ./services/worker
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/mediaflow-worker:${{ env.IMAGE_TAG }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./infra/nginx/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/mediaflow-frontend:${{ env.IMAGE_TAG }}
          build-args: |
            VITE_DEMO_EMAIL=${{ secrets.DEMO_EMAIL }}
            VITE_DEMO_PASSWORD=${{ secrets.DEMO_PASSWORD }}

  deploy:
    name: Deploy to production
    needs: publish
    runs-on: ubuntu-latest

    env:
      IMAGE_TAG: sha-${{ github.sha }}

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: IMAGE_TAG
          script: |
            set -e

            sed -i "s|^FRONTEND_IMAGE=.*|FRONTEND_IMAGE=ghcr.io/emerson-creator/mediaflow-frontend:${IMAGE_TAG}|" /opt/mediaflow/secrets/production.env
            sed -i "s|^GATEWAY_IMAGE=.*|GATEWAY_IMAGE=ghcr.io/emerson-creator/mediaflow-gateway:${IMAGE_TAG}|" /opt/mediaflow/secrets/production.env
            sed -i "s|^INGESTION_IMAGE=.*|INGESTION_IMAGE=ghcr.io/emerson-creator/mediaflow-ingestion:${IMAGE_TAG}|" /opt/mediaflow/secrets/production.env
            sed -i "s|^NOTIFICATION_IMAGE=.*|NOTIFICATION_IMAGE=ghcr.io/emerson-creator/mediaflow-notification:${IMAGE_TAG}|" /opt/mediaflow/secrets/production.env
            sed -i "s|^WORKER_IMAGE=.*|WORKER_IMAGE=ghcr.io/emerson-creator/mediaflow-worker:${IMAGE_TAG}|" /opt/mediaflow/secrets/production.env

            cd /opt/mediaflow

            docker compose \
              --env-file /opt/mediaflow/secrets/production.env \
              -f /opt/mediaflow/compose/docker-compose.prod.yml \
              pull

            docker compose \
              --env-file /opt/mediaflow/secrets/production.env \
              -f /opt/mediaflow/compose/docker-compose.prod.yml \
              up -d

            docker compose \
              --env-file /opt/mediaflow/secrets/production.env \
              -f /opt/mediaflow/compose/docker-compose.prod.yml \
              ps
