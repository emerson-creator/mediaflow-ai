user nginx;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    # Reasonably generous for video/audio uploads passing through Nginx.
    # Note: actual file uploads bypass this (they go direct to MinIO via
    # presigned URL), but this covers any JSON payloads and future needs.
    client_max_body_size 20M;

    include /etc/nginx/conf.d/*.conf;
}