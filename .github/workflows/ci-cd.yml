name: MediaFlow CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/emerson-creator

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            gateway/package-lock.json
            services/ingestion/package-lock.json
            services/notification/package-lock.json

      - name: Validate frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Validate gateway
        working-directory: gateway
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Validate ingestion
        working-directory: services/ingestion
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Validate notification
        working-directory: services/notification
        run: |
          npm ci
          npm run lint
          npm run build

  publish:
    name: Build and publish Docker images
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        run: echo "IMAGE_TAG=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push gateway
        uses: docker/build-push-action@v6
        with:
          context: ./gateway
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/mediaflow-gateway:${{ env.IMAGE_TAG }}

      - name: Build and push ingestion
        uses: docker/build-push-action@v6
        with:
          context: ./services/ingestion
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/mediaflow-ingestion:${{ env.IMAGE_TAG }}

      - name: Build and push notification
        uses: docker/build-push-action@v6
        with:
          context: ./services/notification
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/mediaflow-notification:${{ env.IMAGE_TAG }}

      - name: Build and push worker
        uses: docker/build-push-action@v6
        with:
          context: ./services/worker
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/mediaflow-worker:${{ env.IMAGE_TAG }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./infra/nginx/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/mediaflow-frontend:${{ env.IMAGE_TAG }}
