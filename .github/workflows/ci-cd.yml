name: MediaFlow CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/emerson-creator

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            gateway/package-lock.json
            services/ingestion/package-lock.json
            services/notification/package-lock.json

      - name: Validate frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Validate gateway
        working-directory: gateway
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Validate ingestion
        working-directory: services/ingestion
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Validate notification
        working-directory: services/notification
        run: |
          npm ci
          npm run lint
          npm run build

  publish:
    name: Build and publish Docker images
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        run: echo "IMAGE_TAG=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push gateway
        uses: docker/build-push-action@v6
        with:
          context: ./gateway
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/mediaflow-gateway:${{ env.IMAGE_TAG }}

      - name: Build and push ingestion
        uses: docker/build-push-action@v6
        with:
          context: ./services/ingestion
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/mediaflow-ingestion:${{ env.IMAGE_TAG }}

      - name: Build and push notification
        uses: docker/build-push-action@v6
        with:
          context: ./services/notification
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/mediaflow-notification:${{ env.IMAGE_TAG }}

      - name: Build and push worker
        uses: docker/build-push-action@v6
        with:
          context: ./services/worker
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/mediaflow-worker:${{ env.IMAGE_TAG }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./infra/nginx/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/mediaflow-frontend:${{ env.IMAGE_TAG }}
          build-args: |
            VITE_DEMO_EMAIL=${{ secrets.DEMO_EMAIL }}
            VITE_DEMO_PASSWORD=${{ secrets.DEMO_PASSWORD }}

  deploy:
    name: Deploy to production
    needs: publish
    runs-on: ubuntu-latest

    steps:
      - name: Set image tag
        run: echo "IMAGE_TAG=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: IMAGE_TAG
          script: |
            set -e

            ENV_FILE="/opt/mediaflow/secrets/production.env"
            COMPOSE_FILE="/opt/mediaflow/compose/docker-compose.prod.yml"

            echo "==> Reading currently deployed images"

            PREV_FRONTEND_IMAGE=$(grep '^FRONTEND_IMAGE=' "$ENV_FILE")
            PREV_GATEWAY_IMAGE=$(grep '^GATEWAY_IMAGE=' "$ENV_FILE")
            PREV_INGESTION_IMAGE=$(grep '^INGESTION_IMAGE=' "$ENV_FILE")
            PREV_NOTIFICATION_IMAGE=$(grep '^NOTIFICATION_IMAGE=' "$ENV_FILE")
            PREV_WORKER_IMAGE=$(grep '^WORKER_IMAGE=' "$ENV_FILE")

            echo "Previous version:"
            echo "  $PREV_FRONTEND_IMAGE"
            echo "  $PREV_GATEWAY_IMAGE"
            echo "  $PREV_INGESTION_IMAGE"
            echo "  $PREV_NOTIFICATION_IMAGE"
            echo "  $PREV_WORKER_IMAGE"

            rollback() {
              echo ""
              echo "========================================"
              echo "DEPLOYMENT FAILED - STARTING ROLLBACK"
              echo "========================================"

              sed -i "s|^FRONTEND_IMAGE=.*|$PREV_FRONTEND_IMAGE|" "$ENV_FILE"
              sed -i "s|^GATEWAY_IMAGE=.*|$PREV_GATEWAY_IMAGE|" "$ENV_FILE"
              sed -i "s|^INGESTION_IMAGE=.*|$PREV_INGESTION_IMAGE|" "$ENV_FILE"
              sed -i "s|^NOTIFICATION_IMAGE=.*|$PREV_NOTIFICATION_IMAGE|" "$ENV_FILE"
              sed -i "s|^WORKER_IMAGE=.*|$PREV_WORKER_IMAGE|" "$ENV_FILE"

              echo "==> Restoring previous containers"

              if ! docker compose \
                --env-file "$ENV_FILE" \
                -f "$COMPOSE_FILE" \
                up -d; then
                echo "========================================"
                echo "ROLLBACK FAILED TO START PREVIOUS VERSION"
                echo "========================================"

                docker compose \
                  --env-file "$ENV_FILE" \
                  -f "$COMPOSE_FILE" \
                  ps

                return 1
              fi

              echo "==> Waiting for rollback healthchecks"

              for i in {1..18}; do
                GATEWAY_STATUS=$(docker inspect -f '{{.State.Health.Status}}' mediaflow-gateway 2>/dev/null || echo "missing")
                INGESTION_STATUS=$(docker inspect -f '{{.State.Health.Status}}' mediaflow-ingestion 2>/dev/null || echo "missing")
                NOTIFICATION_STATUS=$(docker inspect -f '{{.State.Health.Status}}' mediaflow-notification 2>/dev/null || echo "missing")
                RABBITMQ_STATUS=$(docker inspect -f '{{.State.Health.Status}}' mediaflow-rabbitmq 2>/dev/null || echo "missing")
                WORKER_STATUS=$(docker inspect -f '{{.State.Health.Status}}' mediaflow-worker 2>/dev/null || echo "missing")

                echo "Rollback health: gateway=$GATEWAY_STATUS ingestion=$INGESTION_STATUS notification=$NOTIFICATION_STATUS rabbitmq=$RABBITMQ_STATUS worker=$WORKER_STATUS"

                if [ "$GATEWAY_STATUS" = "healthy" ] &&
                   [ "$INGESTION_STATUS" = "healthy" ] &&
                   [ "$NOTIFICATION_STATUS" = "healthy" ] &&
                   [ "$RABBITMQ_STATUS" = "healthy" ] &&
                   [ "$WORKER_STATUS" = "healthy" ]; then
                  echo "========================================"
                  echo "ROLLBACK COMPLETED SUCCESSFULLY"
                  echo "========================================"

                  docker compose \
                    --env-file "$ENV_FILE" \
                    -f "$COMPOSE_FILE" \
                    ps

                  return 0
                fi

                sleep 5
              done

              echo "========================================"
              echo "ROLLBACK FAILED"
              echo "========================================"

              docker compose \
                --env-file "$ENV_FILE" \
                -f "$COMPOSE_FILE" \
                ps

              return 1
            }

            echo "==> Updating production image tags"

            sed -i "s|^FRONTEND_IMAGE=.*|FRONTEND_IMAGE=ghcr.io/emerson-creator/mediaflow-frontend:${IMAGE_TAG}|" "$ENV_FILE"
            sed -i "s|^GATEWAY_IMAGE=.*|GATEWAY_IMAGE=ghcr.io/emerson-creator/mediaflow-gateway:${IMAGE_TAG}|" "$ENV_FILE"
            sed -i "s|^INGESTION_IMAGE=.*|INGESTION_IMAGE=ghcr.io/emerson-creator/mediaflow-ingestion:${IMAGE_TAG}|" "$ENV_FILE"
            sed -i "s|^NOTIFICATION_IMAGE=.*|NOTIFICATION_IMAGE=ghcr.io/emerson-creator/mediaflow-notification:${IMAGE_TAG}|" "$ENV_FILE"
            sed -i "s|^WORKER_IMAGE=.*|WORKER_IMAGE=ghcr.io/emerson-creator/mediaflow-worker:${IMAGE_TAG}|" "$ENV_FILE"

            cd /opt/mediaflow

            echo "==> Pulling new images"

            if ! docker compose \
              --env-file "$ENV_FILE" \
              -f "$COMPOSE_FILE" \
              pull; then
              rollback
              exit 1
            fi

            echo "==> Starting new version"

            if ! docker compose \
              --env-file "$ENV_FILE" \
              -f "$COMPOSE_FILE" \
              up -d; then
              rollback
              exit 1
            fi

            echo "==> Waiting for production healthchecks"

            for i in {1..18}; do
              GATEWAY_STATUS=$(docker inspect -f '{{.State.Health.Status}}' mediaflow-gateway 2>/dev/null || echo "missing")
              INGESTION_STATUS=$(docker inspect -f '{{.State.Health.Status}}' mediaflow-ingestion 2>/dev/null || echo "missing")
              NOTIFICATION_STATUS=$(docker inspect -f '{{.State.Health.Status}}' mediaflow-notification 2>/dev/null || echo "missing")
              RABBITMQ_STATUS=$(docker inspect -f '{{.State.Health.Status}}' mediaflow-rabbitmq 2>/dev/null || echo "missing")
              WORKER_STATUS=$(docker inspect -f '{{.State.Health.Status}}' mediaflow-worker 2>/dev/null || echo "missing")

              echo "Health: gateway=$GATEWAY_STATUS ingestion=$INGESTION_STATUS notification=$NOTIFICATION_STATUS rabbitmq=$RABBITMQ_STATUS worker=$WORKER_STATUS"

              if [ "$GATEWAY_STATUS" = "healthy" ] &&
                 [ "$INGESTION_STATUS" = "healthy" ] &&
                 [ "$NOTIFICATION_STATUS" = "healthy" ] &&
                 [ "$RABBITMQ_STATUS" = "healthy" ] &&
                 [ "$WORKER_STATUS" = "healthy" ]; then
                echo "========================================"
                echo "DEPLOYMENT HEALTHCHECK PASSED"
                echo "========================================"

                docker compose \
                  --env-file "$ENV_FILE" \
                  -f "$COMPOSE_FILE" \
                  ps

                exit 0
              fi

              sleep 5
            done

            echo "========================================"
            echo "DEPLOYMENT HEALTHCHECK FAILED"
            echo "========================================"

            docker compose \
              --env-file "$ENV_FILE" \
              -f "$COMPOSE_FILE" \
              ps

            rollback
            exit 1
