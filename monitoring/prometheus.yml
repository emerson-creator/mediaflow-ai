global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "gateway"
    static_configs:
      - targets: ["gateway:3000"]

  - job_name: "worker"
    static_configs:
      - targets: ["worker:8000"]

  - job_name: "rabbitmq"
    static_configs:
      - targets: ["rabbitmq:15692"]
